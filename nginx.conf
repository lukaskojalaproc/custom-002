server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # App uses hash routing, but keep a fallback for direct paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles never change – cache hard; index.html always revalidates.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
